<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="border border-gray-400  rounded-md w-64 m-auto mt-10 p-2">
    <div class="border-b border-gray-400 ">
        <h1 class="text-center text-xl font-bold ">Indice de mas corporal</h1>
    </div>
    
    <div class="flex flex-col items-star gap-2 mt-2 text-neutral-500  p-3">

        <p class="text-left">Peso (KG)</p>
        <input type="text" id="peso" placeholder="Ej.60" class="border border-gray-400 rounded-md  ">
        <p class="text-left">Altura (CM)</p>
        <input type="text" id="altura" placeholder="Ej.170" class="border border-gray-400 rounded-md">
        <button type="button" class="bg-green-500   text-white px-16 py-1 rounded-md">Calcular</button>
        <div id="resultado" class="bg-amber-100 rounded-md p-1 text-sm">-</div>
        
    </div>
    <script src="main.js"></script>

</body>
</html>
