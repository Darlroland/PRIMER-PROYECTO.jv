<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="bg-slate-100 text-slate-800 font-sans  p-4 md:p-8">
    
    <header class="mb-8 border-b-2 border-blue-600 pb-4">
        <h1 class="text-4xl font-extrabold text-slate-900 ">WikiBalls</h1>
        <p class="text-slate-500 mt-1 font-medium">Gestión de Personajes de DBZ</p>
    </header>

    <main class="grid grid-cols-3 gap-8 max-w-7xl mx-auto ">


        <section class="col-span-1">
            <form id="form-personaje" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4 ">
                
                <input type="hidden" id="personaje-id" name="id">
                
                <h2 class="text-xl font-bold text-slate-800 border-b border-slate-100 pb-2">Nuevo Personaje</h2>
                


                <div class="flex flex-col gap-1">
                    <label for="name" class="text-sm font-semibold text-slate-600">Nombre</label>
                    <input type="text" id="name" name="name" required 
                           class="border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>

                <div class="flex flex-col gap-1">
                    <label for="gender" class="text-sm font-semibold text-slate-600">Género</label>
                    <input type="text" id="gender" name="gender" required 
                           class="border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>

                <div class="flex flex-col gap-1">
                    <label for="race" class="text-sm font-semibold text-slate-600">Raza</label>
                    <input type="text" id="race" name="race" required 
                           class="border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                
                <div class="flex flex-col gap-1">
                    <label for="ki" class="text-sm font-semibold text-slate-600">Ki</label>
                    <input type="text" id="ki" name="ki" required 
                           class="border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                
                <div class="flex flex-col gap-1">
                    <label for="image" class="text-sm font-semibold text-slate-600">URL de Imagen</label>
                    <input type="url" id="image" name="image" required 
                           class="border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                
                <div class="flex flex-col gap-1">
                    <label for="description" class="text-sm font-semibold text-slate-600">Descripción</label>
                    <textarea id="description" name="description" rows="3" required 
                              class="border border-slate-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                </div>

                <button type="submit" id="btn-submit" 
                        class="mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-md transition-colors shadow-sm">
                    Agregar Personaje
                </button>
            </form>
        </section>


        <section class="col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-2">
                <h2 class="text-xl font-bold text-slate-800">Lista de personajes</h2>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                    Total: <span id="contador">0</span>
                </span>
            </div>

                    <li class="flex items-center gap-4 bg-white border border-neutral-200 rounded-xl px-4 py-3 hover:border-neutral-300 transition-colors">

                            img src="" alt="" class="w-full h-full object-cover rounded-lg" />

                            <div class="flex items-center gap-2 mt-1">

                        </div>
					</li>
                    -->

            <div id="loading" class="hidden flex justify-center items-center py-12">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mr-3"></div>
                <span class="text-slate-500 font-medium">Sincronizando...</span>
            </div>

        </section>

    </main>

    

    <dialog id="modal-detalles" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 p-6 rounded-xl shadow-2xl border border-slate-200 backdrop:bg-slate-900/50 w-11/12 max-w-md">
        <div class="flex  flex-col gap-4">

            <div class="flex justify-between items-start border-b pb-2">
                <h3 id="modal-nombre" class="text-xl font-bold text-slate-800"></h3>
                <button id="btn-cerrar-modal" class="text-slate-400 hover:text-slate-800 font-bold">&times;</button>
            </div>
            
            <img id="modal-imagen" src="" alt="" class="w-full h-full object-contain object-center rounded-lg">
            
            <div class="grid grid-cols-2 gap-2 text-sm">
                <p><span class="font-bold">Género:</span> <span id="modal-genero"></span></p>
                <p><span class="font-bold">Raza:</span> <span id="modal-raza"></span></p>
                <p><span class="font-bold text-blue-600">Ki:</span> <span id="modal-ki"></span></p>
            </div>
            
            <div class="mt-2 text-sm text-slate-600">
                <p class="font-bold text-slate-800 mb-1">Descripción:</p>
                <p id="modal-descripcion"></p>
            </div>
        </div>
    </dialog>            



    <script src="main.js"></script>
</body>
